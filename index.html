<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para vos, Isabella 🌸</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#080510;color:white;font-family:Arial,sans-serif}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:5;pointer-events:none}
h1{font-size:clamp(2.5rem,7vw,5rem);margin:0;text-shadow:0 0 20px rgba(255,255,255,.6)}
p{font-size:clamp(1rem,2vw,1.3rem);max-width:700px;padding:0 20px}
#btn{pointer-events:auto;margin-top:18px;padding:14px 28px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:white;cursor:pointer;font-size:1rem}
#msg{opacity:0;transition:1s}
.show{opacity:1!important}
</style>
</head>
<body>
<div id="overlay">
<h1>Para vos, Isabella 🌸</h1>
<p>Me parecieron lindas estas dalias y me hicieron acordar a vos.</p>
<button id="btn">🌸 Tocame</button>
<p id="msg">No encontré flores tan lindas como vos, pero estas se acercan bastante 😌</p>
</div>

<script>
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x12051d,10,45);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
camera.position.set(0,2,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const ambient=new THREE.AmbientLight(0xffffff,1.8);
scene.add(ambient);

const light=new THREE.PointLight(0xff99dd,50,100);
light.position.set(5,8,5);
scene.add(light);

function createPetal(hueShift){
  const petalGeo = new THREE.ConeGeometry(0.3, 0.8, 16, 8);
  
  // Crear material con gradiente
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  const gradient = ctx.createLinearGradient(0, 0, 0, 256);
  const baseHue = (hueShift + 270) % 360;
  gradient.addColorStop(0, `hsl(${baseHue}, 100%, 70%)`);
  gradient.addColorStop(0.5, `hsl(${baseHue}, 85%, 55%)`);
  gradient.addColorStop(1, `hsl(${baseHue}, 100%, 40%)`);
  
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);
  
  const texture = new THREE.CanvasTexture(canvas);
  const petalMat = new THREE.MeshStandardMaterial({
    map: texture,
    metalness: 0.2,
    roughness: 0.4
  });
  
  const petal = new THREE.Mesh(petalGeo, petalMat);
  petal.castShadow = true;
  petal.receiveShadow = true;
  
  return petal;
}

function createDahlia(baseHue){
  const group = new THREE.Group();
  
  const layerCount = 8;
  const petalsByLayer = [8, 10, 12, 14, 16, 18, 20, 24];
  
  for(let layer = 0; layer < layerCount; layer++){
    const petals = petalsByLayer[layer];
    const radius = 0.3 + layer * 0.25;
    const height = 0.3 + layer * 0.05;
    
    for(let i = 0; i < petals; i++){
      const petal = createPetal(baseHue + layer * 5);
      
      const angle = (i / petals) * Math.PI * 2;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      
      petal.position.set(x, height, z);
      petal.rotation.x = -Math.PI * 0.3 - layer * 0.1;
      petal.rotation.z = angle;
      petal.scale.set(1 - layer * 0.05, 0.8 - layer * 0.02, 1);
      
      group.add(petal);
    }
  }
  
  // Centro de la flor
  const centerGeo = new THREE.SphereGeometry(0.35, 32, 32);
  const centerMat = new THREE.MeshStandardMaterial({
    color: 0x4a1a4a,
    emissive: 0x6b2d6b,
    emissiveIntensity: 0.3,
    roughness: 0.3
  });
  const center = new THREE.Mesh(centerGeo, centerMat);
  center.position.y = 2.5;
  center.castShadow = true;
  center.receiveShadow = true;
  group.add(center);
  
  return group;
}

const baseHues = [270, 280, 290, 300, 310, 320, 0, 15];
const flowers = [];

for(let i = 0; i < 8; i++){
  const f = createDahlia(baseHues[i]);
  f.position.set((Math.random()-.5)*12, (Math.random()-.5)*5, (Math.random()-.5)*8);
  scene.add(f);
  flowers.push(f);
}

const starGeo = new THREE.BufferGeometry();
const starCount = 1000;
const pos = [];
for(let i = 0; i < starCount; i++){
  pos.push((Math.random()-.5)*60, (Math.random()-.5)*60, (Math.random()-.5)*60);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({size:.08}));
scene.add(stars);

const butterflies = [];
for(let i = 0; i < 6; i++){
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(.15, .08, .02),
    new THREE.MeshBasicMaterial({color: 0x88ccff})
  );
  scene.add(b);
  butterflies.push({mesh: b, offset: Math.random()*10});
}

let t = 0;
function animate(){
  requestAnimationFrame(animate);
  t += 0.01;
  
  flowers.forEach((f, i) => {
    f.rotation.y += 0.001;
    f.position.y += Math.sin(t + i) * 0.002;
  });
  
  butterflies.forEach((b, i) => {
    b.mesh.position.set(
      Math.sin(t + b.offset) * 5,
      Math.cos(t * 1.5 + b.offset) * 2,
      Math.cos(t + b.offset) * 3
    );
  });
  
  camera.position.x = Math.sin(t * 0.3) * 1.5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('btn').onclick = () => {
  document.getElementById('msg').classList.add('show');
};
</script>
</body>
</html>
