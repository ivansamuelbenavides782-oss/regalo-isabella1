<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para vos, Isabella 🌸</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#080510;color:white;font-family:Arial,sans-serif}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:5;pointer-events:none}
h1{font-size:clamp(2.5rem,7vw,5rem);margin:0;text-shadow:0 0 20px rgba(255,255,255,.6)}
p{font-size:clamp(1rem,2vw,1.3rem);max-width:700px;padding:0 20px}
#btn{pointer-events:auto;margin-top:18px;padding:14px 28px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:white;cursor:pointer}
#msg{opacity:0;transition:1s}
.show{opacity:1!important}
</style>
</head>
<body>
<div id="overlay">
<h1>Para vos, Isabella 🌸</h1>
<p>Me parecieron lindas estas dalias y me hicieron acordar a vos.</p>
<button id="btn">🌸 Tocame</button>
<p id="msg">No encontré flores tan lindas como vos, pero estas se acercan bastante 😌</p>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x12051d,10,45);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
camera.position.set(0,2,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const ambient=new THREE.AmbientLight(0xffffff,1.5);
scene.add(ambient);

const light=new THREE.PointLight(0xff99dd,40,100);
light.position.set(5,8,5);
scene.add(light);

function createDahlia(color){
 const group=new THREE.Group();

 for(let layer=0;layer<7;layer++){
   const petals=18+layer*3;
   for(let i=0;i<petals;i++){
      const petal=new THREE.Mesh(
        new THREE.SphereGeometry(.25,.25,12),
        new THREE.MeshStandardMaterial({
          color:color,
          emissive:color,
          emissiveIntensity:.15
        })
      );
      const r=.5+layer*.25;
      const a=(i/petals)*Math.PI*2;
      petal.position.set(Math.cos(a)*r,layer*.08,Math.sin(a)*r);
      petal.scale.set(1.2,.35,2);
      petal.lookAt(0,0,0);
      group.add(petal);
   }
 }
 const center=new THREE.Mesh(
   new THREE.SphereGeometry(.25,16,16),
   new THREE.MeshStandardMaterial({color:0xffdd66})
 );
 group.add(center);
 return group;
}

const colors=[0xff77bb,0xff4d6d,0xc084fc,0xffffff];
const flowers=[];

for(let i=0;i<8;i++){
 const f=createDahlia(colors[i%colors.length]);
 f.position.set((Math.random()-.5)*12,(Math.random()-.5)*5,(Math.random()-.5)*8);
 scene.add(f);
 flowers.push(f);
}

const starGeo=new THREE.BufferGeometry();
const starCount=1000;
const pos=[];
for(let i=0;i<starCount;i++){
 pos.push((Math.random()-.5)*60,(Math.random()-.5)*60,(Math.random()-.5)*60);
}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({size:.08}));
scene.add(stars);

const butterflies=[];
for(let i=0;i<6;i++){
 const b=new THREE.Mesh(
  new THREE.BoxGeometry(.15,.08,.02),
  new THREE.MeshBasicMaterial({color:0x88ccff})
 );
 scene.add(b);
 butterflies.push({mesh:b,offset:Math.random()*10});
}

let t=0;
function animate(){
 requestAnimationFrame(animate);
 t+=0.01;

 flowers.forEach((f,i)=>{
   f.rotation.y+=0.003;
   f.position.y+=Math.sin(t+i)*0.003;
 });

 butterflies.forEach((b,i)=>{
   b.mesh.position.set(
     Math.sin(t+b.offset)*5,
     Math.cos(t*1.5+b.offset)*2,
     Math.cos(t+b.offset)*3
   );
 });

 camera.position.x=Math.sin(t*0.3)*1.5;
 camera.lookAt(0,0,0);

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('btn').onclick=()=>{
 document.getElementById('msg').classList.add('show');
};
</script>
</body>
</html>
